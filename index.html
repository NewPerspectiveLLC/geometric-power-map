<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Geometric Power" />
  <title>Matt's Geometric Power Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css?v=1" />
</head>
<body>
  <header id="top">
    <p class="eyebrow">Geometric Egalitarian</p>
    <h1>Matt's Geometric Power Map</h1>
  </header>
  <div id="map"></div>
  <div id="hud">
    <div id="vortex-readout">
      <strong id="place-name">Ready Athletics</strong>
      <span id="coords"></span>
    </div>
    <div id="btns">
      <button type="button" id="ra-btn" class="active">Ready Athletics</button>
      <button type="button" id="cappy-btn">Cappy's</button>
      <button type="button" id="me-btn">My location</button>
    </div>
    <p class="hint">Drag the gold pin, or tap the map, to move the vortex. 12 wedges stay equal.</p>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/map.js?v=1"></script>
</body>
</html>
