<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Geometric Power" />
  <title>Matt's Geometric Power Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <header id="top">
    <p class="eyebrow">Geometric Egalitarian</p>
    <h1>Matt's Geometric Power Map</h1>
  </header>
  <div id="map"></div>
  <div id="hud">
    <div id="vortex-readout">
      <strong id="place-name">Ready Athletics</strong>
      <span id="coords"></span>
      <span id="lock-status">Unlocked</span>
    </div>
    <div id="btns">
      <button type="button" id="ra-btn" class="active">Ready Athletics</button>
      <button type="button" id="cappy-btn">Cappy's</button>
      <button type="button" id="me-btn">My location</button>
      <button type="button" id="world-btn">World</button>
      <button type="button" id="map-btn" class="active">Street</button>
      <button type="button" id="sat-btn">Satellite</button>
      <button type="button" id="lock-btn">Lock vortex</button>
      <button type="button" id="save-btn">Save</button>
    </div>
    <p class="hint">Drag the gold pin or tap the map. Lock freezes the 12 wedges. Save keeps that vortex on this phone. The lines are great circles.</p>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/map.js?v=3"></script>
</body>
</html>
